<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#075bd8">
<title>बिहार बोर्ड प्रश्न-पत्र प्रदर्शक</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

:root{
    --bg:#e2e8f0;
    --card:#ffffff;
    --card-sub:#f8fafc;
    --text:#0f172a;
    --muted:#475569;
    --border:#cbd5e1;
    --btn-inactive:#f1f5f9;
    --paper-bg:#ffffff;
    --paper-text:#0f172a;
}

body.dark-mode{
    --bg:#050b16;
    --card:#0f172a;
    --card-sub:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#263859;
    --btn-inactive:#1e293b;
    --paper-bg:#111c38;
    --paper-text:#f8fafc;
}

body{
    font-family:'Inter','Noto Sans Devanagari',sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:background .3s,color .3s;
}

.glass-bar{
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(16px);
}

body.dark-mode .glass-bar{
    background:rgba(15,23,42,.95);
}

.ctrl-btn{
    background:var(--btn-inactive);
    color:var(--text);
    border:1px solid var(--border);
    transition:all .2s;
}

.ctrl-btn:hover{
    border-color:#fb7185;
}

/* Realistic Paper Sheet Container */
.paper-sheet{
    background:var(--paper-bg);
    color:var(--paper-text);
    border:1px solid var(--border);
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    border-radius:16px;
    transform-origin:top center;
    transition:transform .2s ease;
}

.paper-content h1,.paper-content h2,.paper-content h3,.paper-content h4{
    font-weight:800;
    margin:14px 0 8px;
}
.paper-content p{
    margin-bottom:10px;
    line-height:1.7;
}
.paper-content ul,.paper-content ol{
    padding-left:22px;
    margin:10px 0;
}
.paper-content table{
    width:100%;
    border-collapse:collapse;
    margin:12px 0;
    font-size:13px;
}
.paper-content th,.paper-content td{
    border:1px solid var(--border);
    padding:9px 12px;
    text-align:left;
}
.paper-content th{
    background:#881337;
    color:#ffffff;
    font-weight:800;
}
.paper-content .q-card{
    padding:14px;
    border-radius:14px;
    background:var(--card-sub);
    border:1px solid var(--border);
    margin:12px 0;
}
.paper-content .ans-badge{
    display:inline-block;
    margin-top:8px;
    padding:4px 12px;
    border-radius:8px;
    background:rgba(16,185,129,.15);
    color:#10b981;
    font-weight:800;
    font-size:12px;
}

/* Clean Document Frame Wrapper (Hides external chrome) */
.clean-doc-stage{
    position:relative;
    width:100%;
    max-width:900px;
    height:calc(100vh - 130px);
    margin:0 auto;
    border-radius:18px;
    overflow:hidden;
    border:2px solid var(--border);
    background:#0f172a;
    box-shadow:0 20px 50px rgba(0,0,0,.55);
}

/* Blocks top-right external pop-out icon in embedded documents */
.frame-shield{
    position:absolute;
    top:0;
    right:0;
    width:72px;
    height:64px;
    z-index:20;
    background:transparent;
}

@media print{
    .no-print{
        display:none !important;
    }
    body{
        height:auto;
        overflow:visible;
        background:#ffffff !important;
        color:#000000 !important;
    }
    #viewerWorkspace{
        overflow:visible !important;
        padding:0 !important;
    }
    .paper-sheet{
        box-shadow:none !important;
        border:none !important;
        background:#ffffff !important;
        color:#000000 !important;
        transform:none !important;
    }
}
</style>
</head>

<body class="dark-mode">

<!-- Top Reader Header -->
<header class="no-print glass-bar border-b border-[var(--border)] px-3.5 py-2.5 flex items-center justify-between gap-2 z-30 shadow-md">
    <div class="flex items-center gap-2.5 min-w-0">
        <a href="model_paper.html" class="px-3 py-2 rounded-xl ctrl-btn text-xs font-extrabold flex items-center gap-1.5 shrink-0">
            <span>←</span> <span class="hidden sm:inline">वापस जाएं</span>
        </a>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR85M-RpzWbsEMOZ3jXpsKutWt7DwktZVveue8WOLNj-w&s" 
             onerror="this.src='logo.png'" 
             class="w-9 h-9 rounded-full bg-white p-0.5 object-contain border border-rose-300 shrink-0" alt="BSEB">
        <div class="min-w-0">
            <span id="docMetaBadge" class="block text-[10px] font-extrabold text-rose-400 uppercase tracking-wider truncate">बिहार विद्यालय परीक्षा समिति</span>
            <h1 id="docTitle" class="text-xs sm:text-sm font-extrabold truncate">मॉडल प्रश्न-पत्र लोड हो रहा है...</h1>
        </div>
    </div>

    <!-- Reader Controls (Zoom, Page Nav, Print, Theme) -->
    <div class="flex items-center gap-1.5 shrink-0">
        <!-- Page Controls (Shown when multi-page canvas is active) -->
        <div id="pageControls" class="hidden items-center gap-1 mr-1 bg-[var(--card-sub)] px-2 py-1 rounded-xl border border-[var(--border)]">
            <button type="button" onclick="changePage(-1)" class="w-7 h-7 rounded-lg ctrl-btn text-xs font-extrabold">◀</button>
            <span id="pageIndicator" class="text-[11px] font-extrabold px-2">1 / 1</span>
            <button type="button" onclick="changePage(1)" class="w-7 h-7 rounded-lg ctrl-btn text-xs font-extrabold">▶</button>
        </div>

        <!-- Zoom Controls -->
        <div class="flex items-center gap-1 bg-[var(--card-sub)] px-1.5 py-1 rounded-xl border border-[var(--border)]">
            <button type="button" onclick="adjustZoom(-0.15)" class="w-7 h-7 rounded-lg ctrl-btn text-xs font-extrabold" title="छोटा करें">➖</button>
            <span id="zoomBadge" class="text-[11px] font-extrabold px-1.5 min-w-[44px] text-center">100%</span>
            <button type="button" onclick="adjustZoom(0.15)" class="w-7 h-7 rounded-lg ctrl-btn text-xs font-extrabold" title="बड़ा करें">➕</button>
        </div>

        <button type="button" onclick="toggleFullscreenReader()" class="w-9 h-9 rounded-xl ctrl-btn flex items-center justify-center text-sm font-extrabold" title="फुलस्क्रीन">⛶</button>
        <button type="button" onclick="window.print()" class="px-3 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-xs font-extrabold shadow hidden sm:flex items-center gap-1">
            🖨️ प्रिंट
        </button>
        <button type="button" onclick="toggleTheme()" id="themeBtn" class="w-9 h-9 rounded-xl ctrl-btn flex items-center justify-center text-base">☀️</button>
    </div>
</header>

<!-- View Switcher Bar (Only visible if paper has both visual pages and text questions) -->
<div id="dualModeSwitchBar" class="hidden no-print bg-[var(--card-sub)] border-b border-[var(--border)] px-4 py-2 flex items-center justify-center gap-2 z-20">
    <button type="button" onclick="switchReaderView('document')" id="viewBtn-document" class="px-4 py-1.5 rounded-xl text-xs font-extrabold bg-rose-600 text-white shadow">
        📖 मूल प्रश्न-पत्र पृष्ठ (Paper View)
    </button>
    <button type="button" onclick="switchReaderView('interactive')" id="viewBtn-interactive" class="px-4 py-1.5 rounded-xl text-xs font-extrabold ctrl-btn">
        📝 प्रश्न एवं उत्तर सेट (Interactive View)
    </button>
</div>

<!-- Main Reader Workspace -->
<main id="viewerWorkspace" class="flex-1 overflow-y-auto p-3 sm:p-6 relative">

    <!-- Loading Indicator -->
    <div id="readerLoader" class="max-w-md mx-auto my-16 p-8 rounded-3xl bg-[var(--card)] border border-[var(--border)] text-center space-y-3 shadow-xl">
        <div class="w-12 h-12 border-4 border-rose-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <h2 class="text-sm font-extrabold">प्रश्न-पत्र तैयार किया जा रहा है...</h2>
        <p class="text-xs text-[var(--muted)]">कृपया प्रतीक्षा करें, आधिकारिक प्रश्न-पत्र लोड हो रहा है।</p>
    </div>

    <!-- 1. JavaScript Canvas / Document Viewer Stage -->
    <div id="documentStage" class="hidden">
        <!-- Direct Canvas Render (PDF.js) -->
        <div id="canvasHolder" class="hidden flex flex-col items-center gap-4">
            <canvas id="pdfRenderCanvas" class="paper-sheet max-w-full"></canvas>
        </div>

        <!-- Protected Seamless Document Frame (No URL or External Bar) -->
        <div id="protectedFrameHolder" class="hidden clean-doc-stage">
            <div class="frame-shield" title="BSEB Official Question Paper"></div>
            <iframe id="seamlessDocFrame" src="about:blank" class="w-full h-full border-0" allow="autoplay"></iframe>
        </div>
    </div>

    <!-- 2. Structured Question Paper Sheet Stage -->
    <div id="interactiveStage" class="hidden max-w-4xl mx-auto">
        <div id="zoomablePaperSheet" class="paper-sheet p-5 sm:p-9">
            <!-- Official BSEB Examination Header -->
            <div class="text-center border-b-2 border-[var(--border)] pb-5 mb-5">
                <span id="sheetSetCode" class="inline-block px-3 py-0.5 rounded-full bg-rose-500/15 text-rose-400 text-xs font-extrabold mb-1">SET - A</span>
                <h2 class="text-lg sm:text-2xl font-extrabold tracking-wide">बिहार विद्यालय परीक्षा समिति, पटना</h2>
                <p class="text-[11px] sm:text-xs font-bold text-[var(--muted)] uppercase">BIHAR SCHOOL EXAMINATION BOARD, PATNA</p>
                <h3 id="sheetMainHeading" class="text-sm sm:text-lg font-extrabold text-rose-400 mt-1.5"></h3>

                <div id="sheetSubMeta" class="flex flex-wrap items-center justify-center gap-4 mt-3 pt-3 border-t border-dashed border-[var(--border)] text-xs font-bold text-[var(--muted)]"></div>
            </div>

            <!-- Question Paper Body -->
            <div id="sheetQuestionsBody" class="paper-content text-xs sm:text-sm"></div>
        </div>
    </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3cjqdjRTiI17iVxTdDLjFRoWTaZZOPFs",
  authDomain: "unichat-62506.firebaseapp.com",
  projectId: "unichat-62506",
  storageBucket: "unichat-62506.firebasestorage.app",
  messagingSenderId: "443100124271",
  appId: "1:443100124271:web:f1a79bcccd2850d965a99a",
  measurementId: "G-KG7VG83H1Z"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadSelectedPaper() {
    const params = new URLSearchParams(window.location.search);
    const paperId = params.get("id");

    // Check sessionStorage cache first for instant load
    const cached = sessionStorage.getItem("bseb_active_paper");
    if (cached) {
        try {
            const parsed = JSON.parse(cached);
            if (!paperId || parsed.id === paperId) {
                window.initializePaperViewer(parsed);
                return;
            }
        } catch (e) {}
    }

    if (!paperId) {
        showEmptyError("कोई प्रश्न-पत्र चयनित नहीं है। कृपया वापस जाकर विषय चुनें।");
        return;
    }

    try {
        let snap = await getDoc(doc(db, "model_papers", paperId));
        if (!snap.exists()) {
            snap = await getDoc(doc(db, "materials", paperId));
        }

        if (snap.exists()) {
            const data = snap.data();
            window.initializePaperViewer({
                id: snap.id,
                title: data.title,
                subject: data.subject || "सामान्य विषय",
                className: data.className || "Class 10",
                stream: data.stream || "All",
                examYear: data.examYear || "2027",
                setCode: data.setCode || "Set-A",
                fullMarks: data.fullMarks || "100",
                duration: data.duration || "3 घंटे 15 मिनट",
                docSource: data.pdfLink || data.driveLink || data.url || "",
                questionsBody: data.htmlContent || (data.description ? `<p>${data.description}</p>` : "")
            });
        } else {
            showEmptyError("यह प्रश्न-पत्र उपलब्ध नहीं है।");
        }
    } catch (err) {
        showEmptyError("प्रश्न-पत्र लोड करने में समस्या आई। कृपया पुनः प्रयास करें।");
    }
}

function showEmptyError(msg) {
    const loader = document.getElementById("readerLoader");
    loader.innerHTML = `
        <div class="text-3xl">📄</div>
        <h3 class="text-sm font-extrabold text-rose-400">${msg}</h3>
        <a href="model_paper.html" class="inline-block mt-2 px-5 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-extrabold">
            ← सभी मॉडल प्रश्न-पत्र देखें
        </a>
    `;
}

loadSelectedPaper();
</script>

<script>
// Configure PDF.js worker
if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

let currentZoom = 1.0;
let pdfDocInstance = null;
let currentPageNum = 1;
let totalPagesCount = 1;

function formatProtectedSource(raw) {
    if (!raw) return "";
    const match = raw.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
        return `https://drive.google.com/file/d/${match[1]}/preview`;
    }
    const idParam = raw.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (raw.includes("drive.google.com") && idParam && idParam[1]) {
        return `https://drive.google.com/file/d/${idParam[1]}/preview`;
    }
    return raw;
}

window.initializePaperViewer = function(paper) {
    document.getElementById("readerLoader").classList.add("hidden");

    const metaText = `${paper.className || "Class 10"} ${paper.stream && paper.stream !== "All" ? "• " + paper.stream : ""} • ${paper.subject || ""} (${paper.examYear || "2027"})`;
    document.getElementById("docMetaBadge").innerText = metaText;
    document.getElementById("docTitle").innerText = paper.title || "बिहार बोर्ड मॉडल प्रश्न-पत्र";

    // Populate structured paper sheet
    document.getElementById("sheetSetCode").innerText = `${paper.setCode || "SET-A"} • परीक्षा वर्ष ${paper.examYear || "2027"}`;
    document.getElementById("sheetMainHeading").innerText = `${paper.title || ""} — ${paper.subject || ""}`;
    document.getElementById("sheetSubMeta").innerHTML = `
        <span>🎓 कक्षा: <b class="text-[var(--text)]">${paper.className || "Class 10"}</b></span>
        <span>🎯 पूर्णांक: <b class="text-[var(--text)]">${paper.fullMarks || "100"}</b></span>
        <span>⏱️ समय: <b class="text-[var(--text)]">${paper.duration || "3 घंटे 15 मिनट"}</b></span>
    `;

    const hasDoc = !!(paper.docSource && paper.docSource.trim());
    const hasQuestions = !!(paper.questionsBody && paper.questionsBody.trim());

    if (hasQuestions) {
        document.getElementById("sheetQuestionsBody").innerHTML = paper.questionsBody;
    }

    if (hasDoc && hasQuestions) {
        document.getElementById("dualModeSwitchBar").classList.remove("hidden");
    }

    if (hasDoc) {
        switchReaderView("document");
        renderDocumentSource(paper.docSource.trim());
    } else {
        switchReaderView("interactive");
    }
};

async function renderDocumentSource(sourceUrl) {
    const isDriveSource = sourceUrl.includes("drive.google.com");

    // Try rendering via JavaScript PDF.js Canvas first for direct document files
    if (!isDriveSource && window.pdfjsLib) {
        try {
            const loadingTask = window.pdfjsLib.getDocument(sourceUrl);
            pdfDocInstance = await loadingTask.promise;
            totalPagesCount = pdfDocInstance.numPages;
            currentPageNum = 1;

            document.getElementById("canvasHolder").classList.remove("hidden");
            document.getElementById("protectedFrameHolder").classList.add("hidden");
            document.getElementById("pageControls").classList.remove("hidden");
            document.getElementById("pageControls").classList.add("flex");

            renderPdfPage(currentPageNum);
            return;
        } catch (err) {
            // Fallback to seamless frame if cross-origin blocks direct canvas byte read
        }
    }

    // Seamless in-app document viewer (hides raw URLs)
    document.getElementById("canvasHolder").classList.add("hidden");
    document.getElementById("protectedFrameHolder").classList.remove("hidden");
    document.getElementById("seamlessDocFrame").src = formatProtectedSource(sourceUrl);
}

async function renderPdfPage(num) {
    if (!pdfDocInstance) return;
    const page = await pdfDocInstance.getPage(num);
    const canvas = document.getElementById("pdfRenderCanvas");
    const ctx = canvas.getContext("2d");

    const viewport = page.getViewport({ scale: currentZoom * 1.45 });
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    await page.render({ canvasContext: ctx, viewport }).promise;
    document.getElementById("pageIndicator").innerText = `${num} / ${totalPagesCount}`;
}

function changePage(delta) {
    if (!pdfDocInstance) return;
    const next = currentPageNum + delta;
    if (next < 1 || next > totalPagesCount) return;
    currentPageNum = next;
    renderPdfPage(currentPageNum);
}

function adjustZoom(delta) {
    currentZoom = Math.min(2.0, Math.max(0.65, +(currentZoom + delta).toFixed(2)));
    document.getElementById("zoomBadge").innerText = `${Math.round(currentZoom * 100)}%`;

    if (pdfDocInstance) {
        renderPdfPage(currentPageNum);
    }

    const sheet = document.getElementById("zoomablePaperSheet");
    if (sheet) {
        sheet.style.transform = `scale(${currentZoom})`;
    }

    const frame = document.getElementById("seamlessDocFrame");
    if (frame) {
        frame.style.transform = `scale(${currentZoom})`;
        frame.style.transformOrigin = "top center";
    }
}

function switchReaderView(mode) {
    const docStage = document.getElementById("documentStage");
    const intStage = document.getElementById("interactiveStage");
    const docBtn = document.getElementById("viewBtn-document");
    const intBtn = document.getElementById("viewBtn-interactive");

    if (mode === "document") {
        docStage.classList.remove("hidden");
        intStage.classList.add("hidden");
        if (docBtn) docBtn.className = "px-4 py-1.5 rounded-xl text-xs font-extrabold bg-rose-600 text-white shadow";
        if (intBtn) intBtn.className = "px-4 py-1.5 rounded-xl text-xs font-extrabold ctrl-btn";
    } else {
        docStage.classList.add("hidden");
        intStage.classList.remove("hidden");
        if (intBtn) intBtn.className = "px-4 py-1.5 rounded-xl text-xs font-extrabold bg-rose-600 text-white shadow";
        if (docBtn) docBtn.className = "px-4 py-1.5 rounded-xl text-xs font-extrabold ctrl-btn";
    }
}

function toggleFullscreenReader() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

function toggleTheme() {
    document.body.classList.toggle("dark-mode");
    const isDark = document.body.classList.contains("dark-mode");
    document.getElementById("themeBtn").innerText = isDark ? "☀️" : "🌙";
}
</script>

</body>
</html>
